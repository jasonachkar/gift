<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Believe In You!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Fireworks Canvas */
        #fireworks {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Main Content */
        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 20px;
        }

        /* Character Container */
        .character-container {
            position: relative;
            margin-bottom: 30px;
        }

        /* Jumping Character */
        .character {
            font-size: 120px;
            animation: jump 0.6s ease-in-out infinite;
            display: inline-block;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
            cursor: pointer;
            transition: transform 0.2s;
        }

        .character:hover {
            transform: scale(1.1);
        }

        @keyframes jump {
            0%, 100% {
                transform: translateY(0) rotate(-5deg);
            }
            50% {
                transform: translateY(-40px) rotate(5deg);
            }
        }

        /* Hearts floating around character */
        .floating-hearts {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .heart {
            position: absolute;
            font-size: 24px;
            animation: floatHeart 3s ease-in-out infinite;
            opacity: 0.8;
        }

        .heart:nth-child(1) { left: -30px; top: 20%; animation-delay: 0s; }
        .heart:nth-child(2) { right: -30px; top: 30%; animation-delay: 0.5s; }
        .heart:nth-child(3) { left: -20px; top: 60%; animation-delay: 1s; }
        .heart:nth-child(4) { right: -20px; top: 50%; animation-delay: 1.5s; }

        @keyframes floatHeart {
            0%, 100% {
                transform: translateY(0) scale(1);
                opacity: 0.8;
            }
            50% {
                transform: translateY(-20px) scale(1.2);
                opacity: 1;
            }
        }

        /* Message */
        .message {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 50px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            animation: fadeInUp 1s ease-out, pulse 2s ease-in-out infinite;
        }

        .message h1 {
            color: #e91e63;
            font-size: 2rem;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(233, 30, 99, 0.2);
        }

        .message p {
            color: #6a1b9a;
            font-size: 1.3rem;
            line-height: 1.6;
            font-weight: 500;
        }

        .message .highlight {
            color: #e91e63;
            font-weight: bold;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            }
            50% {
                box-shadow: 0 20px 80px rgba(233, 30, 99, 0.3);
            }
        }

        /* Flowers Container */
        #flowers {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .flower {
            position: absolute;
            font-size: 40px;
            animation: bloomAndFloat 4s ease-out forwards;
            opacity: 0;
        }

        @keyframes bloomAndFloat {
            0% {
                transform: scale(0) rotate(0deg);
                opacity: 0;
            }
            20% {
                transform: scale(1.2) rotate(20deg);
                opacity: 1;
            }
            40% {
                transform: scale(1) rotate(-10deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) rotate(0deg) translateY(-100px);
                opacity: 0;
            }
        }

        /* Sparkles */
        .sparkle {
            position: fixed;
            font-size: 20px;
            animation: sparkle 1.5s ease-in-out infinite;
            pointer-events: none;
            z-index: 2;
        }

        @keyframes sparkle {
            0%, 100% {
                opacity: 0;
                transform: scale(0);
            }
            50% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Confetti */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            pointer-events: none;
            z-index: 3;
            animation: confettiFall linear forwards;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Footer */
        .footer {
            position: fixed;
            bottom: 20px;
            text-align: center;
            color: white;
            font-size: 1rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .footer span {
            animation: heartBeat 1s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        /* Click hint */
        .click-hint {
            color: white;
            font-size: 0.9rem;
            margin-top: 20px;
            opacity: 0.8;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <canvas id="fireworks"></canvas>
    <div id="flowers"></div>

    <div class="content">
        <div class="character-container">
            <div class="floating-hearts">
                <span class="heart">💕</span>
                <span class="heart">💖</span>
                <span class="heart">💗</span>
                <span class="heart">💝</span>
            </div>
            <div class="character" id="character" onclick="celebrate()">🧑‍🎓</div>
        </div>

        <div class="message">
            <h1>I Love You Baby! 💖</h1>
            <p>
                <span class="highlight">I support you!</span><br>
                I believe you can do this!! 🌟<br><br>
                You're amazing and you're going to crush it!<br>
                The world is lucky to have you! 🎉
            </p>
        </div>

        <p class="click-hint">✨ Click the graduate for extra magic! ✨</p>
    </div>

    <div class="footer">
        Made with <span>❤️</span> for you
    </div>

    <script>
        // Fireworks Canvas
        const canvas = document.getElementById('fireworks');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Firework particles
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.velocity = {
                    x: (Math.random() - 0.5) * 8,
                    y: (Math.random() - 0.5) * 8
                };
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.005;
                this.size = Math.random() * 3 + 2;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.velocity.y += 0.05; // gravity
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.alpha -= this.decay;
            }
        }

        // Firework rocket
        class Firework {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height;
                this.targetY = Math.random() * (canvas.height * 0.5) + 50;
                this.velocity = { y: -8 - Math.random() * 4 };
                this.color = this.randomColor();
                this.exploded = false;
                this.particles = [];
            }

            randomColor() {
                const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#54a0ff', '#5f27cd', '#00d2d3', '#ff9f43'];
                return colors[Math.floor(Math.random() * colors.length)];
            }

            draw() {
                if (!this.exploded) {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                }
                this.particles.forEach(p => p.draw());
            }

            update() {
                if (!this.exploded) {
                    this.y += this.velocity.y;
                    if (this.y <= this.targetY) {
                        this.explode();
                    }
                }
                this.particles = this.particles.filter(p => p.alpha > 0);
                this.particles.forEach(p => p.update());
            }

            explode() {
                this.exploded = true;
                const particleCount = 60 + Math.floor(Math.random() * 40);
                for (let i = 0; i < particleCount; i++) {
                    this.particles.push(new Particle(this.x, this.y, this.color));
                }
            }

            isDead() {
                return this.exploded && this.particles.length === 0;
            }
        }

        let fireworks = [];

        function animateFireworks() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Add new fireworks randomly
            if (Math.random() < 0.03) {
                fireworks.push(new Firework());
            }

            fireworks = fireworks.filter(f => !f.isDead());
            fireworks.forEach(f => {
                f.update();
                f.draw();
            });

            requestAnimationFrame(animateFireworks);
        }

        animateFireworks();

        // Flower spawning
        const flowerEmojis = ['🌸', '🌺', '🌷', '🌹', '🌻', '💐', '🌼', '🪻', '🪷'];
        const flowersContainer = document.getElementById('flowers');

        function spawnFlower() {
            const flower = document.createElement('div');
            flower.className = 'flower';
            flower.textContent = flowerEmojis[Math.floor(Math.random() * flowerEmojis.length)];
            flower.style.left = Math.random() * 100 + '%';
            flower.style.top = Math.random() * 100 + '%';
            flower.style.fontSize = (30 + Math.random() * 30) + 'px';
            flowersContainer.appendChild(flower);

            // Remove flower after animation
            setTimeout(() => flower.remove(), 4000);
        }

        // Spawn flowers periodically
        setInterval(spawnFlower, 800);

        // Sparkles
        function createSparkle() {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.textContent = '✨';
            sparkle.style.left = Math.random() * 100 + '%';
            sparkle.style.top = Math.random() * 100 + '%';
            sparkle.style.animationDelay = Math.random() * 2 + 's';
            document.body.appendChild(sparkle);

            setTimeout(() => sparkle.remove(), 3000);
        }

        // Initial sparkles
        for (let i = 0; i < 15; i++) {
            setTimeout(createSparkle, i * 200);
        }
        setInterval(createSparkle, 500);

        // Confetti on click
        function createConfetti() {
            const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#54a0ff', '#5f27cd', '#00d2d3'];
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (2 + Math.random() * 3) + 's';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                document.body.appendChild(confetti);

                setTimeout(() => confetti.remove(), 5000);
            }
        }

        // Celebration function when clicking character
        function celebrate() {
            createConfetti();

            // Burst of fireworks
            for (let i = 0; i < 5; i++) {
                setTimeout(() => fireworks.push(new Firework()), i * 100);
            }

            // Burst of flowers
            for (let i = 0; i < 10; i++) {
                setTimeout(spawnFlower, i * 100);
            }

            // Character reaction
            const character = document.getElementById('character');
            character.style.animation = 'none';
            character.offsetHeight; // Trigger reflow
            character.style.animation = 'jump 0.3s ease-in-out infinite';

            setTimeout(() => {
                character.style.animation = 'jump 0.6s ease-in-out infinite';
            }, 2000);
        }

        // Initial celebration
        setTimeout(celebrate, 1000);
    </script>
</body>
</html>
